<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Be My Valentine?</title>
  <style>
    :root{
      --bg1:#ffd1dc;
      --bg2:#ffb6c1;
      --accent:#ff6b9a;
      --card:#fff;
      --shadow: 0 8px 30px rgba(255, 107, 154, .18);
      --radius:18px;
      --button-shadow: 0 8px 20px rgba(0,0,0,0.12);
      --font-cursive: 'Pacifico', cursive;
    }
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@300;400;600;700&display=swap');
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
    body{
      background: radial-gradient(1200px 600px at 10% 10%, #fff2f6 0%, rgba(255,255,255,0) 20%), linear-gradient(135deg,var(--bg1),var(--bg2));
      display:flex;align-items:center;justify-content:center;overflow:hidden;padding:40px;
    }
    .scene{
      position:relative; width:860px; max-width:95vw; height:520px; max-height:90vh;
      background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.85)); border-radius:calc(var(--radius) + 6px); box-shadow:var(--shadow); overflow:hidden; display:flex; align-items:center; justify-content:center;
    }
    .hearts {
      position:absolute; inset:0; pointer-events:none;
    }
    .floating-heart{ position:absolute; width:18px; height:18px; transform:translateY(0); opacity:.9; animation: floatUp 6s linear infinite; }
    @keyframes floatUp{ 0%{ transform:translateY(0) scale(0.8); opacity:0 } 10%{opacity:1} 100%{ transform:translateY(-720px) scale(1.2); opacity:0 }}

    .card{
      width:78%; max-width:680px; height:84%; background:linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,245,250,0.95)); border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:36px; box-shadow:var(--button-shadow);
    }
    .question{
      text-align:center; margin-top:6px;
    }
    .question h1{ font-family: Pacifico, cursive; font-size:48px; margin:4px 0; color: #b91c6b; text-shadow: 0 2px 0 rgba(255,255,255,0.6);}
    .question p{ margin:0; color:#7b2f4a; font-weight:600; letter-spacing:0.2px }

    .buttons{ position:relative; width:100%; display:flex; gap:18px; align-items:center; justify-content:center; margin-bottom:18px; }
    .btn{
      appearance:none; border:0; cursor:pointer; background:linear-gradient(180deg,#fff,#ffe6ef); padding:14px 28px; font-weight:700; color:#9b1558; border-radius:999px; box-shadow:var(--button-shadow); font-size:18px; transition:transform .15s ease, box-shadow .15s ease; position:relative; z-index:2;
    }
    .btn:active{ transform:translateY(2px); }
    .btn.yes{ background:linear-gradient(180deg,#ffccd9,#ff9fb6); color:#fff; box-shadow: 0 10px 30px rgba(255,107,154,0.28); }
    .btn.no{ background:linear-gradient(180deg,#fff6f9,#ffeef6); }
    .playful{ font-size:14px; color:#a84b6e; margin-top:6px }

    .no-wrapper{ position:relative; width:140px; height:56px; display:inline-block; }
    .no-btn{ position:absolute; left:0; top:0; }

    /* success view */
    .success{
      position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(180deg, rgba(255,250,250,0.95), rgba(255,240,247,0.95)); backdrop-filter: blur(6px); opacity:0; pointer-events:none; transform:scale(.98); transition:opacity .35s ease, transform .45s ease; z-index:10;
    }
    .success.show{ opacity:1; pointer-events:auto; transform:scale(1); }
    .gift{
      width:260px; height:260px; border-radius:18px; background:linear-gradient(135deg,#fff,#fff5f9); display:flex; align-items:center; justify-content:center; box-shadow: 0 18px 40px rgba(186,40,100,0.12); margin-bottom:18px; overflow:hidden;
    }
    .yay-text{ font-family: Pacifico, cursive; font-size:46px; color:#b91c6b; margin:0; }
    .sub{ color:#7b2f4a; font-weight:600 }

    /* confetti */
    .confetti{ position:absolute; inset:0; pointer-events:none; }
    .confetti i{ position:absolute; width:10px; height:16px; opacity:0.95; transform-origin:center; animation: fall var(--dur) linear infinite; }
    @keyframes fall{ 0%{ transform:translateY(-20vh) rotate(0); opacity:1 } 100%{ transform:translateY(110vh) rotate(540deg); opacity:0 } }

    /* small responsive tweaks */
    @media (max-width:520px){ .card{ padding:22px } .question h1{ font-size:32px } .btn{ font-size:16px; padding:12px 20px } }
  </style>
</head>
<body>
  <div class="scene">
    <div class="hearts" aria-hidden>
      <!-- floating hearts generated by JS -->
    </div>

    <div class="card" role="main">
      <div class="question">
        <h1>Will you be my Valentine?</h1>
        <p>Be my special someone this Valentine's Day 💌</p>
      </div>

      <div class="buttons" aria-hidden>
        <button class="btn yes" id="yesBtn">Yes, of course!</button>

        <div class="no-wrapper">
          <button class="btn no no-btn" id="noBtn">Nope</button>
        </div>
      </div>

      <div class="playful"></div>
      <!--<div class="playful">Tip: Try to click 'No' — it's quite shy 😉</div>-->
    </div>

    <div class="success" id="success">
      <div class="gift" id="gift">
        <!-- Inline SVG "photo" as cute valentine image -->
        <svg width="220" height="220" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="g1" x1="0" x2="1">
              <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
              <stop offset="1" stop-color="#ffd6e0"/>
            </linearGradient>
          </defs>
          <rect width="200" height="200" rx="18" fill="url(#g1)" />
          <g transform="translate(30,28)">
            <path d="M70 20c-8-12-28-12-36 0-12 18 2 46 36 74 34-28 48-56 36-74-8-12-28-12-36 0z" fill="#ff5b9a"/>
            <circle cx="30" cy="28" r="8" fill="#fff" opacity="0.18" />
            <g transform="translate(90,130) scale(.9)">
              <circle cx="0" cy="0" r="18" fill="#ffd6e0"/>
            </g>
          </g>
        </svg>
      </div>
      <div style="text-align:center">
        <p class="yay-text">Yayy</p>
        <p class="sub">You clicked yes — so sweet! 💖</p>
      </div>
      <div style="height:18px"></div>
    </div>

    <div class="confetti" id="confetti"></div>
  </div>

  <script>
    // Small helper: random int
    const rnd = (min, max) => Math.floor(Math.random()*(max-min+1))+min;

    // Create floating hearts for background
    const heartsLayer = document.querySelector('.hearts');
    for(let i=0;i<16;i++){
      const h = document.createElement('div');
      h.className='floating-heart';
      const size = rnd(12,28);
      h.style.width = size+'px'; h.style.height = size+'px';
      const left = rnd(-10,100);
      h.style.left = left+'%';
      h.style.bottom = rnd(-40,10)+'px';
      h.style.backgroundImage = `radial-gradient(circle at 35% 33%, #fff4 0%, transparent 20%), linear-gradient(180deg, #ff9ab5, #ff6b9a)`;
      h.style.borderRadius='50% 50% 50% 50% / 60% 60% 40% 40%';
      h.style.transform = 'rotate('+rnd(-30,30)+'deg)';
      h.style.setProperty('--delay', (i*0.45)+'s');
      h.style.animationDelay = (i*0.25)+'s';
      h.style.opacity = (0.6 + Math.random()*0.4).toFixed(2);
      heartsLayer.appendChild(h);
    }

    const scene = document.querySelector('.scene');
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const noWrapper = document.querySelector('.no-wrapper');
    const success = document.getElementById('success');
    const confetti = document.getElementById('confetti');

    // Position the No button inside its wrapper absolutely and make the wrapper a bounding box
    function placeNo(x, y){
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    }

    // Initialize to center
    const wrapperRect = () => noWrapper.getBoundingClientRect();
    const btnRect = () => noBtn.getBoundingClientRect();

    // Start centered
    placeNo(0,0);

    // Evasive behavior: when the mouse gets close, or on mouseenter, move the button
    let evadeCount = 0;
    function moveNoRandomly() {
      const w = noWrapper.clientWidth - noBtn.offsetWidth;
      const h = noWrapper.clientHeight - noBtn.offsetHeight;
      // sometimes jump outside the wrapper (playful) but within scene
      const sceneRect = scene.getBoundingClientRect();
      const maxX = Math.max(8, sceneRect.width - noBtn.offsetWidth - 24);
      const maxY = Math.max(8, sceneRect.height - noBtn.offsetHeight - 60);

      // increase range with attempts
      const jitter = Math.min(220 + evadeCount*30, 420);
      const x = rnd(-Math.min(60, jitter), Math.min(maxX, jitter));
      const y = rnd(-Math.min(40, jitter/2), Math.min(maxY, jitter/2));
      noBtn.style.transition = 'left .28s cubic-bezier(.2,.9,.2,1), top .28s cubic-bezier(.2,.9,.2,1)';
      placeNo(x, y);
      evadeCount++;
    }

    // Move quickly when mouse enters or moves near
    noBtn.addEventListener('mouseenter', (e)=>{ moveNoRandomly(); });

    // Also move when mouse moves inside scene and pointer is near the button
    scene.addEventListener('mousemove', (e)=>{
      const btn = btnRect();
      const dx = e.clientX - (btn.left + btn.width/2);
      const dy = e.clientY - (btn.top + btn.height/2);
      const dist = Math.hypot(dx,dy);
      if(dist < 120){ moveNoRandomly(); }
    });

    // Prevent clicking No: when clicked, jump away quickly
    noBtn.addEventListener('click', (e)=>{ e.preventDefault(); moveNoRandomly(); });

    // Keep button in bounds on resize
    window.addEventListener('resize', ()=>{ noBtn.style.transition=''; placeNo(0,0); });

    // Yes button -> show success "page"
    yesBtn.addEventListener('click', (e)=>{
      // reveal success overlay
      success.classList.add('show');
      // play confetti
      spawnConfetti();
      // optional: gentle pulse on gift
      const gift = document.getElementById('gift');
      gift.animate([{ transform:'scale(.98)' },{ transform:'scale(1.02)' },{ transform:'scale(1)' }], { duration:900, easing:'ease-out' });
    });

    // Create confetti pieces
    function spawnConfetti(){
      confetti.innerHTML = '';
      const colors = ['#ff6b9a','#ffd1e0','#ffb6c1','#ffc7e0','#ff9ab5'];
      for(let i=0;i<28;i++){
        const el = document.createElement('i');
        el.style.left = rnd(0,100)+'%';
        el.style.top = '-20%';
        el.style.background = colors[i % colors.length];
        el.style.width = rnd(6,12)+'px';
        el.style.height = rnd(8,18)+'px';
        el.style.borderRadius = (Math.random()>0.6? '2px':'50%');
        el.style.setProperty('--dur', (4 + Math.random()*3)+'s');
        el.style.transform = 'translateY(-10vh) rotate('+rnd(0,360)+'deg)';
        el.style.animationDelay = (Math.random()*0.6)+'s';
        el.style.opacity = 0.95;
        confetti.appendChild(el);
      }
      // remove after 6s
      setTimeout(()=>{ confetti.innerHTML = '' }, 7000);
    }

    // Accessibility: keyboard support for Yes
    yesBtn.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' || e.key===' ') yesBtn.click(); });

    // Small playful nudge: every 7s, slightly shift the No button to keep it lively
    setInterval(()=>{ if(!success.classList.contains('show')){ moveNoRandomly(); } }, 7000);
  </script>
</body>
</html>
